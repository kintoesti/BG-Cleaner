<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Photopea : fond magenta → transparent → PNG</title>
<style>
  body     { font-family: system-ui, sans-serif; margin: 16px; }
  #barre   { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #log     { color: #333; font-size: 14px; font-weight: 600; }
  #journal { background: #101410; color: #9f9; font: 12px/1.5 Consolas, monospace;
             height: 130px; overflow-y: auto; padding: 6px 10px; margin: 10px 0;
             white-space: pre-wrap; }
  iframe   { width: 100%; height: 66vh; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2 style="margin:0 0 10px">Photopea — fond magenta #FF00FF → transparent → PNG</h2>

<div id="barre">
  <input type="file" id="fichiers" multiple accept="image/*">
  <button id="test">Tester la connexion</button>
  <span id="log">Chargement de Photopea…</span>
</div>

<div id="journal"></div>
<iframe id="photopea" src="https://www.photopea.com"></iframe>

<script>
/* ================== RÉGLAGES ================== */
const TOLERANCE = 32;   // 8–16 : PNG net | 48–64 : JPEG
const EXPAND_PX = 1;    // mange la frange magenta (0 = off)
/* =============================================== */

const iframe  = document.getElementById("photopea");
const logEl   = document.getElementById("log");
const journal = document.getElementById("journal");
const input   = document.getElementById("fichiers");

let etat = "boot";   // boot → pret → ouverture → traitement
let files = [], filesEnAttente = [];
let fileCourant = null, nomSortie = "";
let chrono = null, nbOK = 0, nbKO = 0;

function j(texte, couleur) {
  const d = document.createElement("div");
  d.textContent = "[" + new Date().toLocaleTimeString() + "] " + texte;
  if (couleur) d.style.color = couleur;
  journal.appendChild(d);
  journal.scrollTop = journal.scrollHeight;
}
function statut(t) { logEl.textContent = t; }
function envoyer(code) {
  iframe.contentWindow.postMessage(JSON.stringify({ script: code }), "*");
}

/* ---------- réception des messages de Photopea ---------- */
window.addEventListener("message", (e) => {
  if (e.source !== iframe.contentWindow) return;

  if (e.data instanceof ArrayBuffer) {            // le PNG demandé !
    clearTimeout(chrono);
    nbOK++;
    telecharger(e.data, nomSortie);
    j("✔ PNG téléchargé : " + nomSortie, "#6f6");
    etat = "pret"; fileCourant = null;
    statut("Succès — fichier suivant…");
    setTimeout(traiteSuivant, 500);
    return;
  }
  if (typeof e.data !== "string") return;

  if (e.data.indexOf("NDOCS:") === 0) {           // réponse de notre sonde
    const n = parseInt(e.data.slice(6), 10) || 0;
    if (etat === "boot") {
      etat = "pret";
      statut("Prêt ✔ — choisissez une ou plusieurs images.");
      j("Photopea est prêt.", "#6f6");
      if (filesEnAttente.length) { files = filesEnAttente; filesEnAttente = []; traiteSuivant(); }
    } else if (etat === "ouverture" && n > 0) {
      j("Image ouverte dans Photopea.", "#6f6");
      lancerTraitement();
    }
    return;
  }
  if (e.data === "done") return;                  // signal générique, ignoré

  const err = e.data.indexOf("ERR") === 0;        // tout autre message s'affiche
  j("Photopea : " + e.data, err ? "#f66" : "#888");
});

/* ---------- sélection des fichiers ---------- */
input.addEventListener("change", () => {
  const n = [...input.files];
  input.value = "";
  if (etat !== "pret") {
    filesEnAttente = filesEnAttente.concat(n);
    statut("Fichiers mis en attente — Photopea n'a pas fini de charger.");
    return;
  }
  files = n;
  traiteSuivant();
});

function traiteSuivant() {
  if (etat !== "pret") return;
  if (!files.length) { statut("Terminé — " + nbOK + " réussi(s), " + nbKO + " échec(s)."); return; }

  const file = files.shift();
  fileCourant = file;
  nomSortie = file.name.replace(/\.[^.]+$/, "") + "-transparent.png";

  etat = "ouverture";
  statut("Ouverture de " + file.name + "…");
  j("→ Envoi de « " + file.name + " » (" + Math.round(file.size/1024) + " Ko)…");

  clearTimeout(chrono);
  chrono = setTimeout(() => echec("l'image ne s'est jamais ouverte (délai dépassé)"), 90000);

  const reader = new FileReader();
  reader.onload = () => {
    envoyer(
      "try{if(app.documents.length){app.activeDocument.close(SaveOptions.DONOTSAVECHANGES);}}catch(e){};" +
      "app.open(" + JSON.stringify(reader.result) + ");"
    );
  };
  reader.readAsDataURL(file);
}

/* ---------- détourage (envoyé seulement quand l'image EST ouverte) ---------- */
function lancerTraitement() {
  etat = "traitement";
  statut("Détourage…");
  clearTimeout(chrono);
  chrono = setTimeout(() => echec("délai dépassé pendant le détourage / l'export"), 60000);

  envoyer(`
    (function(){
      function dire(m){ app.echoToOE(m); }
      try {
        var doc = app.activeDocument;
        if (!doc) { dire("ERR: aucun document ouvert"); return; }

        try {
          var lay = doc.activeLayer;
          if (lay.isBackground) { lay.isBackground = false; }
        } catch(e) {}

        doc.selection.select([[0,0],[1,0],[1,1],[0,1]]);
        try { doc.selection.similar(${TOLERANCE}); }
        catch(e1) {
          try { doc.selection.grow(${TOLERANCE}); }
          catch(e2) { dire("ERR: selection.similar indisponible (" + e2.message + ")"); return; }
        }

        try {
          var d = new ActionDescriptor(), r = new ActionReference();
          r.putProperty(charIDToTypeID("Chnl"), charIDToTypeID("fsel"));
          d.putReference(charIDToTypeID("null"), r);
          d.putUnitDouble(charIDToTypeID("By  "), charIDToTypeID("#Pxl"), ${EXPAND_PX});
          executeAction(charIDToTypeID("Expn"), d, DialogModes.NO);
        } catch(e) {}

        doc.selection.clear();
        doc.selection.deselect();

        doc.saveToOE(${JSON.stringify(nomSortie)});
        dire("OK: magenta supprimé, export du PNG en cours…");
      } catch(e) {
        dire("ERR: " + (e && e.message ? e.message : e));
      }
    })();
  `);
}

function echec(pourquoi) {
  clearTimeout(chrono);
  nbKO++;
  j("✘ ÉCHEC (" + (fileCourant ? fileCourant.name : "?") + ") : " + pourquoi, "#f66");
  statut("Échec — passage au fichier suivant…");
  envoyer("try{app.activeDocument.close(SaveOptions.DONOTSAVECHANGES);}catch(e){}");
  etat = "pret"; fileCourant = null;
  setTimeout(traiteSuivant, 800);
}

/* ---------- bouton test ---------- */
document.getElementById("test").addEventListener("click", () => {
  envoyer("app.echoToOE('CONNEXION-OK');");
  j("Ping envoyé — la réponse doit apparaître ci-dessous en quelques secondes…");
});

function telecharger(buffer, nom) {
  const blob = new Blob([buffer], { type: "image/png" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- sonde : détecte que Photopea répond et que l'image est ouverte ---------- */
setInterval(() => {
  if (etat === "boot" || etat === "ouverture") {
    envoyer("app.echoToOE('NDOCS:' + (app.documents ? app.documents.length : 0));");
  }
}, 1500);

/* ---------- avertissement si Photopea ne répond jamais ---------- */
setTimeout(() => {
  if (etat === "boot") {
    j("⚠ Aucune réponse de Photopea après 90 s.", "#fc6");
    j("  Vérifiez : connexion internet, bloqueur de publicités, réseau d'entreprise.", "#fc6");
    j("  Cliquez « Tester la connexion » : une réponse doit apparaître ici.", "#fc6");
  }
}, 90000);

iframe.addEventListener("load", () => {
  j("Iframe chargée — Photopea s'initialise (30 à 60 s au premier lancement)…");
});
</script>
</body>
</html>
