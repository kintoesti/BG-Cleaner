<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fond magenta → transparent → PNG</title>
<style>
  body   { font-family: system-ui, sans-serif; margin: 16px; max-width: 1100px; }
  .barre { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  #galerie { display: flex; flex-wrap: wrap; gap: 14px; }
  .carte { width: 240px; }
  .apercu { height: 240px; border: 1px solid #ccc; display: flex; align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0/20px 20px; }
  .apercu img { max-width: 100%; max-height: 100%; }
  .nom   { font-size: 12px; color: #333; overflow: hidden; white-space: nowrap;
           text-overflow: ellipsis; }
  .ok::after { content: " ✔ téléchargé"; color: green; font-weight: 600; }
</style>
</head>
<body>

<h2>Fond magenta #FF00FF → transparent → PNG</h2>
<p>Tout se passe dans votre navigateur, sans serveur ni Photopea.</p>

<div class="barre">
  <input type="file" id="fichiers" multiple accept="image/*">
  <label>Tolérance <input type="number" id="tol" value="60" min="0" max="120" style="width:4em"></label>
  <label><input type="checkbox" id="despill" checked> Corriger la frange des bords</label>
  <button id="relancer">Relancer le traitement</button>
  <span id="log"></span>
</div>

<div id="galerie"></div>

<script>
const input     = document.getElementById("fichiers");
const tolEl     = document.getElementById("tol");
const despillEl = document.getElementById("despill");
const logEl     = document.getElementById("log");
const galerie   = document.getElementById("galerie");

let originaux = [];

input.addEventListener("change", async () => {
  originaux = [];
  galerie.innerHTML = "";
  for (const f of input.files) {
    const img = new Image();
    img.src = await lire(f);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    originaux.push({ nom: f.name.replace(/\.[^.]+$/, ""), image: img });
  }
  traiterTout();
});

document.getElementById("relancer").addEventListener("click", () => {
  if (originaux.length) traiterTout();
});

function lire(f) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
}

function traiterTout() {
  const t = parseInt(tolEl.value, 10) || 0;
  logEl.textContent = "Traitement…";
  originaux.forEach((o, i) => setTimeout(() => traiter(o, i, t), i * 400));
}

function traiter(o, index, t) {
  const c = document.createElement("canvas");
  c.width  = o.image.naturalWidth;
  c.height = o.image.naturalHeight;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(o.image, 0, 0);

  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d  = im.data;
  const rMin = 255 - t, gMax = t;

  for (let i = 0; i < d.length; i += 4) {
    if (d[i] >= rMin && d[i+2] >= rMin && d[i+1] <= gMax) d[i+3] = 0;
  }

  if (despillEl.checked) {
    const w = c.width, h = c.height;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        if (d[i+3] === 0) continue;
        const bord =
          d[i - 4     + 3] === 0 || d[i + 4     + 3] === 0 ||
          d[i - w * 4 + 3] === 0 || d[i + w * 4 + 3] === 0;
        if (bord && d[i] > d[i+1] + 30 && d[i+2] > d[i+1] + 30) {
          const g = d[i+1];
          d[i]   = g + (d[i]   - g) * 0.2;
          d[i+2] = g + (d[i+2] - g) * 0.2;
        }
      }
    }
  }

  ctx.putImageData(im, 0, 0);

  let carte = document.getElementById("c" + index);
  if (!carte) {
    carte = document.createElement("div");
    carte.className = "carte"; carte.id = "c" + index;
    carte.innerHTML = '<div class="apercu"><img></div><div class="nom"></div>';
    galerie.appendChild(carte);
  }
  carte.querySelector("img").src = c.toDataURL("image/png");
  carte.querySelector(".nom").textContent = o.nom + ".png";

  c.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = o.nom + "-transparent.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    carte.querySelector(".nom").classList.add("ok");
    logEl.textContent = "Terminé ✔";
  }, "image/png");
}
</script>
</body>
</html>
