<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Retirer une couleur de fond → PNG transparent</title>
<style>
  body   { font-family: system-ui, sans-serif; margin: 16px; max-width: 1100px; }
  .barre { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  #zoneCouleur { display: none; gap: 12px; align-items: center; flex-wrap: wrap;
                 border: 1px dashed #999; padding: 8px 12px; border-radius: 8px; }
  #couleur { width: 42px; height: 32px; padding: 0; border: 1px solid #999; cursor: pointer; }
  #hex { width: 7.5em; }
  #galerie { display: flex; flex-wrap: wrap; gap: 14px; }
  .carte { width: 240px; }
  .apercu { height: 240px; border: 1px solid #ccc; display: flex; align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0/20px 20px; }
  .apercu img { max-width: 100%; max-height: 100%; }
  body.mode-couleur .apercu img { cursor: crosshair; }
  .nom   { font-size: 12px; color: #333; overflow: hidden; white-space: nowrap;
           text-overflow: ellipsis; }
  .ok::after { content: " ✔ téléchargé"; color: green; font-weight: 600; }
  .astuce { font-size: 13px; color: #555; }
</style>
</head>
<body>

<h2>Retirer une couleur de fond → PNG transparent</h2>
<p class="astuce">Tout se passe dans votre navigateur, sans serveur.</p>

<div class="barre">
  <input type="file" id="fichiers" multiple accept="image/*">
  <select id="mode">
    <option value="blanc" selected>Fond blanc</option>
    <option value="magenta">Fond magenta #FF00FF</option>
    <option value="couleur">Couleur personnalisée 🎨</option>
  </select>
  <label>Tolérance <input type="number" id="tol" value="80" min="0" max="441" style="width:4.5em"></label>
  <label title="Contour de l'image ignoré : contourne le fin liseré gris parfois généré par l'IA">
    Bord à ignorer <input type="number" id="skip" value="4" min="0" max="30" style="width:3.5em"> px</label>
  <label title="Retire aussi le blanc enfermé dans le sujet : cadres, yeux, trous… (mode blanc uniquement)">
    <input type="checkbox" id="trous"> Blancs intérieurs</label>
  <label><input type="checkbox" id="despill" checked> Corriger la frange des bords</label>
  <button id="relancer">Relancer le traitement</button>
  <span id="log"></span>
</div>

<div class="barre" id="zoneCouleur">
  <label>Couleur à retirer
    <input type="color" id="couleur" value="#ff00ff">
    <input type="text" id="hex" value="#FF00FF" spellcheck="false">
  </label>
  <span class="astuce">🖱️ Pipette : cliquez sur une image ci-dessous pour prélever la couleur du fond.
  Le traitement se relance automatiquement.</span>
</div>

<div id="galerie"></div>

<script>
const input       = document.getElementById("fichiers");
const modeEl      = document.getElementById("mode");
const tolEl       = document.getElementById("tol");
const skipEl      = document.getElementById("skip");
const trousEl     = document.getElementById("trous");
const despillEl   = document.getElementById("despill");
const zoneCouleur = document.getElementById("zoneCouleur");
const couleurEl   = document.getElementById("couleur");
const hexEl       = document.getElementById("hex");
const logEl       = document.getElementById("log");
const galerie     = document.getElementById("galerie");

/* ---------- Gestion des modes ---------- */

function appliquerMode() {
  const v = modeEl.value;
  tolEl.value = v === "blanc" ? 80 : v === "magenta" ? 60 : 100;
  zoneCouleur.style.display = v === "couleur" ? "flex" : "none";
  document.body.classList.toggle("mode-couleur", v === "couleur");
  trousEl.disabled = v !== "blanc";
}
modeEl.addEventListener("change", appliquerMode);
appliquerMode();

let originaux = [];

input.addEventListener("change", async () => {
  originaux = [];
  galerie.innerHTML = "";
  for (const f of input.files) {
    const img = new Image();
    img.src = await lire(f);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

    // Mémorise les pixels D'ORIGINE : la pipette reste fiable même après traitement
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    originaux.push({ nom: f.name.replace(/\.[^.]+$/, ""), image: img,
                     data: cx.getImageData(0, 0, c.width, c.height) });
  }
  traiterTout();
});

document.getElementById("relancer").addEventListener("click", () => {
  if (originaux.length) traiterTout();
});

function lire(f) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
}

/* ---------- Pipette ---------- */

galerie.addEventListener("click", e => {
  if (modeEl.value !== "couleur" || e.target.tagName !== "IMG") return;
  const carte = e.target.closest(".carte");
  if (!carte) return;
  const o = originaux[+carte.id.slice(1)];
  if (o) prelever(o, e);
});

function prelever(o, e) {
  const rect = e.target.getBoundingClientRect();
  const w = o.image.naturalWidth, h = o.image.naturalHeight;
  const x = Math.min(w - 1, Math.max(0, Math.round((e.clientX - rect.left) / rect.width  * w)));
  const y = Math.min(h - 1, Math.max(0, Math.round((e.clientY - rect.top)  / rect.height * h)));
  const d = o.data.data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let dy = -2; dy <= 2; dy++) {          // moyenne 5×5 : insensible au bruit JPG
    for (let dx = -2; dx <= 2; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      const i = (yy * w + xx) * 4;
      r += d[i]; g += d[i+1]; b += d[i+2]; n++;
    }
  }
  const hex = "#" + [r/n, g/n, b/n].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
  couleurEl.value = hex;
  hexEl.value = hex.toUpperCase();
  traiterTout();
}

/* ---------- Saisie de la couleur (sélecteur + code hex) ---------- */

couleurEl.addEventListener("input", () => { hexEl.value = couleurEl.value.toUpperCase(); });
couleurEl.addEventListener("change", siPret);
hexEl.addEventListener("change", () => {
  let v = hexEl.value.trim();
  if (v && v[0] !== "#") v = "#" + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    couleurEl.value = v.toLowerCase();
    hexEl.value = v.toUpperCase();
    siPret();
  } else {
    hexEl.value = couleurEl.value.toUpperCase();  // code invalide → on restaure
  }
});

function siPret() { if (originaux.length) traiterTout(); }

/* ---------- Traitement ---------- */

function traiterTout() {
  const t       = parseInt(tolEl.value, 10)  || 0;
  const skip    = parseInt(skipEl.value, 10) || 0;
  const trous   = trousEl.checked;
  const despill = despillEl.checked;
  const hex     = couleurEl.value;
  const mode    = modeEl.value;
  logEl.textContent = "Traitement…";
  originaux.forEach((o, i) => setTimeout(() => traiter(o, i, mode, t, skip, trous, despill, hex), i * 400));
}

function traiter(o, index, mode, t, skip, trous, despill, hex) {
  const c = document.createElement("canvas");
  c.width  = o.image.naturalWidth;
  c.height = o.image.naturalHeight;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(o.image, 0, 0);

  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d  = im.data;
  const w  = c.width, h = c.height;

  if (mode === "blanc")        detourerBlanc(d, w, h, t, trous, skip);
  else if (mode === "magenta") detourerMagenta(d, t);
  else                         detourerCouleur(d, w, h, t, despill, hex);

  if (mode === "couleur") {
    const [cr, cg, cb] = hexVersRgb(hex);
    nettoyerBande(d, w, h, skip, i => {
      const dr = d[i] - cr, dg = d[i+1] - cg, db = d[i+2] - cb;
      return Math.sqrt(dr*dr + dg*dg + db*db) < t + 40;
    });
  } else {
    nettoyerBande(d, w, h, skip, i => Math.min(d[i], d[i+1], d[i+2]) >= 90);
  }

  if (despill && mode === "blanc")   despillBlanc(d, w, h);
  if (despill && mode === "magenta") despillMagenta(d, w, h);
  // mode couleur : le dé-mélange est déjà fait dans detourerCouleur

  ctx.putImageData(im, 0, 0);

  let carte = document.getElementById("c" + index);
  if (!carte) {
    carte = document.createElement("div");
    carte.className = "carte"; carte.id = "c" + index;
    carte.innerHTML = '<div class="apercu"><img></div><div class="nom"></div>';
    galerie.appendChild(carte);
  }
  carte.querySelector("img").src = c.toDataURL("image/png");
  carte.querySelector(".nom").textContent = o.nom + ".png";

  c.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = o.nom + "-transparent.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    carte.querySelector(".nom").classList.add("ok");
    logEl.textContent = "Terminé ✔";
  }, "image/png");
}

function hexVersRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

/* ---------- Mode magenta ---------- */

function detourerMagenta(d, t) {
  const rMin = 255 - t, gMax = t;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] >= rMin && d[i+2] >= rMin && d[i+1] <= gMax) d[i+3] = 0;
  }
}

function despillMagenta(d, w, h) {
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      if (d[i+3] === 0) continue;
      const bord =
        d[i - 4     + 3] === 0 || d[i + 4     + 3] === 0 ||
        d[i - w * 4 + 3] === 0 || d[i + w * 4 + 3] === 0;
      if (bord && d[i] > d[i+1] + 30 && d[i+2] > d[i+1] + 30) {
        const g = d[i+1];
        d[i]   = g + (d[i]   - g) * 0.2;
        d[i+2] = g + (d[i+2] - g) * 0.2;
      }
    }
  }
}

/* ---------- Mode blanc ---------- */

function detourerBlanc(d, w, h, t, trous, skip) {
  const s = 255 - t;
  const estBlanc = i => d[i] >= s && d[i+1] >= s && d[i+2] >= s;

  if (trous) {
    for (let i = 0; i < d.length; i += 4) {
      if (estBlanc(i)) d[i+3] = 0;
    }
    return;
  }

  const m = Math.max(0, Math.min(skip, ((Math.min(w, h) >> 1) - 1)));
  const visite = new Uint8Array(w * h);
  const pile   = new Int32Array(w * h);
  let sommet = 0;

  const empiler = (x, y) => {
    const p = y * w + x;
    if (!visite[p] && estBlanc(p * 4)) { visite[p] = 1; pile[sommet++] = p; }
  };

  if (m < 1) {
    for (let x = 0; x < w; x++) { empiler(x, 0); empiler(x, h - 1); }
    for (let y = 0; y < h; y++) { empiler(0, y); empiler(w - 1, y); }
  } else {
    const x1 = w - 1 - m, y1 = h - 1 - m;
    for (let x = m; x <= x1; x++) { empiler(x, m); empiler(x, y1); }
    for (let y = m; y <= y1; y++) { empiler(m, y); empiler(x1, y); }
  }

  while (sommet > 0) {
    const p = pile[--sommet];
    d[p * 4 + 3] = 0;
    const x = p % w, y = (p / w) | 0;
    if (x > 0)     empiler(x - 1, y);
    if (x < w - 1) empiler(x + 1, y);
    if (y > 0)     empiler(x, y - 1);
    if (y < h - 1) empiler(x, y + 1);
  }
}

function despillBlanc(d, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i+3] === 0) continue;
      const bord =
        (x > 0     && d[i - 4     + 3] === 0) ||
        (x < w - 1 && d[i + 4     + 3] === 0) ||
        (y > 0     && d[i - w * 4 + 3] === 0) ||
        (y < h - 1 && d[i + w * 4 + 3] === 0);
      if (!bord) continue;

      const m = Math.min(d[i], d[i+1], d[i+2]);
      if (m < 25) continue;
      const a = Math.max(1 - m / 255, 0.25);
      for (let k = 0; k < 3; k++) {
        d[i + k] = (d[i + k] - (1 - a) * 255) / a;
      }
    }
  }
}

/* ---------- Mode couleur personnalisée ---------- */

function detourerCouleur(d, w, h, t, despill, hex) {
  const [cr, cg, cb] = hexVersRgb(hex);
  const t1 = t * 0.5;                // < t1 : totalement transparent
  const t2 = Math.max(t1 + 1, t);    // > t2 : totalement opaque
  const alpha = new Float32Array(w * h);

  for (let p = 0, i = 0; p < w * h; p++, i += 4) {
    const dr = d[i] - cr, dg = d[i+1] - cg, db = d[i+2] - cb;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    alpha[p] = Math.min(1, Math.max(0, (dist - t1) / (t2 - t1)));
  }

  if (despill) {
    // Dé-mélange : pixel = α·sujet + (1-α)·fond  →  sujet = (pixel − (1-α)·fond) / α
    for (let p = 0, i = 0; p < w * h; p++, i += 4) {
      const a = alpha[p];
      if (a > 0.02 && a < 0.98) {
        d[i]   = (d[i]   - (1 - a) * cr) / a;
        d[i+1] = (d[i+1] - (1 - a) * cg) / a;
        d[i+2] = (d[i+2] - (1 - a) * cb) / a;
      }
    }
  }

  for (let p = 0, i = 0; p < w * h; p++, i += 4) {
    d[i+3] = alpha[p] < 0.02 ? 0 : Math.round(alpha[p] * 255);
  }
}

function nettoyerBande(d, w, h, skip, estFond) {
  const m = Math.max(0, Math.min(skip, ((Math.min(w, h) >> 1) - 1)));
  if (m < 1) return;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (x >= m && x < w - m && y >= m && y < h - m) continue;
      const i = (y * w + x) * 4;
      if (estFond(i)) d[i+3] = 0;
    }
  }
}
</script>
</body>
</html>
